services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: focuspilot
      POSTGRES_PASSWORD: focuspilot
      POSTGRES_DB: focuspilot
    ports:
      - "5432:5432"
    volumes:
      - focuspilot_db_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U focuspilot"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  focuspilot_db_data:
